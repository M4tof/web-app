# --- Server & HTTPS ---
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:secret123}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:webapp}

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb?currentSchema=app_auth}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# --- Custom App Security Secrets ---
app.security.pepper=${PEPPER_SECRET:local_dev_fallback_pepper_not_for_prod}

# Run schema.sql on database connection
spring.sql.init.mode=always
spring.sql.init.separator=;;
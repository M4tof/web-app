services:
  db:
    image: postgres:16-alpine
    container_name: local-postgres
    restart: always
    env_file:
      - db.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/tabelki.sql:/docker-entrypoint-initdb.d/01-tabelki.sql:ro

  app:
    build: .
    container_name: web-app
    restart: always
    ports:
      - "8443:8443"
    env_file:
      - server.env
    depends_on:
      - db

volumes:
  pgdata: